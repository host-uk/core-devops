name: Shell Lint

on:
  push:
    branches: [dev, main]
    paths: ['**.sh', '**.bash', 'scripts/**']
  pull_request:
    branches: [dev, main]
    paths: ['**.sh', '**.bash', 'scripts/**']
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: '.'
          format: gcc
