name: Bug Report
description: Report a problem with the developer workspace or scripts
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the details below.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux (Ubuntu/Debian)
        - Linux (Other)
    validations:
      required: true

  - type: input
    id: script
    attributes:
      label: Script/Command
      description: Which script or command failed?
      placeholder: "e.g., make setup, install-deps.ps1, core doctor"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste any error messages
      render: shell
